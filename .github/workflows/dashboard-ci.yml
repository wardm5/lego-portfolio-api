name: Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dashboard/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r dashboard/requirements-dev.txt

      - name: Run dashboard tests
        run: pytest -c dashboard/pytest.ini dashboard/tests -v
